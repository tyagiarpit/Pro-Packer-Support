<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pro Packer Support</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			display: grid;
			place-items: center;
			background: #f5f7fb;
			color: #172033;
			font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			width: min(100%, 500px);
			padding: 44px 32px;
			text-align: center;
			background: #fff;
			border: 1px solid #e6e9f0;
			border-radius: 16px;
			box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
		}
		h1 { margin: 0; font-size: clamp(2rem, 7vw, 2.5rem); line-height: 1.2; }
		p { margin: 16px 0 0; color: #596276; }
		a {
			display: inline-block;
			margin-top: 24px;
			padding: 12px 22px;
			border-radius: 8px;
			background: #3659c9;
			color: #fff;
			font-weight: 600;
			text-decoration: none;
		}
		a:hover { background: #2949b2; }
		a:focus-visible { outline: 3px solid #aebeff; outline-offset: 3px; }
		.response { margin-top: 18px; font-size: 0.9rem; }
	</style>
</head>
<body>
	<main>
		<h1>Pro Packer Support</h1>
		<p>Need help with Pro Packer? Email us and we’ll be happy to help.</p>
		<a href="mailto:contact@arpittyagi.com">Email contact@arpittyagi.com</a>
		<p class="response">We’ll respond within two business days.</p>
	</main>
</body>
</html>
